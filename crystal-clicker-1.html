<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Clicker</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
  background: linear-gradient(135deg, #0d0a1a 0%, #1a0a30 100%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

#game {
  width: 100%;
  max-width: 450px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px 0 20px;
}

h1 {
  color: #f0c040;
  font-size: 1.6rem;
  margin: 15px 0 5px;
  text-align: center;
  font-weight: 700;
}

.subtitle {
  color: #9060e0;
  font-size: 0.85rem;
  margin-bottom: 15px;
}

.stats {
  background: linear-gradient(135deg, #1a1430 0%, #2a1a50 100%);
  border: 2px solid #9060e0;
  border-radius: 15px;
  padding: 16px 20px;
  width: calc(100% - 32px);
  margin: 0 16px 15px;
  text-align: center;
}

.main-number {
  font-size: 2.2rem;
  font-weight: 800;
  color: #f0c040;
  line-height: 1;
  margin-bottom: 10px;
}

.stat-row {
  display: flex;
  justify-content: space-around;
  gap: 15px;
  margin-top: 8px;
  font-size: 0.8rem;
}

.stat-item span {
  display: block;
}

.stat-label {
  color: #7060a0;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-value {
  color: #b0a0ff;
  font-weight: 700;
  margin-top: 2px;
}

.gem-button {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 32%, #d0a0ff, #6030c0 50%, #200a60);
  border: 3px solid #9060e0;
  box-shadow: 0 0 50px rgba(120, 60, 220, 0.8), inset -3px -3px 10px rgba(0, 0, 0, 0.4);
  font-size: 5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.06s;
  margin: 15px 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
}

.gem-button:active {
  transform: scale(0.88);
}

.ad-btn {
  background: linear-gradient(135deg, #1a1040 0%, #3a1a70 100%);
  border: 2px solid #9060e0;
  border-radius: 12px;
  color: #b090ff;
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  width: calc(100% - 32px);
  margin: 0 16px 15px;
  transition: all 0.2s;
  -webkit-appearance: none;
  appearance: none;
}

.ad-btn:active:not(:disabled) {
  background: linear-gradient(135deg, #2a1a60 0%, #4a2a80 100%);
  border-color: #f0c040;
  color: #f0c040;
}

.ad-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.section-title {
  color: #f0c040;
  font-size: 0.9rem;
  margin: 15px 0 8px 16px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  width: calc(100% - 32px);
}

.shop {
  width: 100%;
  padding: 0 16px;
  box-sizing: border-box;
}

.item-card {
  background: linear-gradient(135deg, #1a1430 0%, #241a40 100%);
  border: 2px solid #2d2060;
  border-radius: 12px;
  padding: 11px 14px;
  margin-bottom: 7px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-appearance: none;
  appearance: none;
}

.item-card:active {
  background: linear-gradient(135deg, #2a1e50 0%, #341e60 100%);
  transform: scale(0.96);
}

.item-card.locked {
  opacity: 0.35;
  cursor: not-allowed;
}

.item-icon {
  font-size: 1.8rem;
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.item-info {
  flex: 1;
}

.item-name {
  font-weight: 700;
  font-size: 0.9rem;
  color: #d4c0ff;
}

.item-desc {
  font-size: 0.7rem;
  color: #7060a0;
  margin-top: 2px;
}

.item-right {
  text-align: right;
  flex-shrink: 0;
  font-size: 0.8rem;
}

.item-price {
  color: #f0c040;
  font-weight: 700;
  font-size: 0.85rem;
}

.item-price.affordable {
  color: #60e080;
}

.item-effect {
  color: #60e080;
  font-size: 0.65rem;
  margin-top: 2px;
}

.item-count {
  color: #9060e0;
  font-size: 0.7rem;
  margin-top: 4px;
}

.achievements {
  width: 100%;
  padding: 0 16px;
  box-sizing: border-box;
}

.ach-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.badge {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 0.65rem;
  border: 1px solid;
  font-weight: 600;
  white-space: nowrap;
}

.badge.locked {
  border-color: #2d2060;
  color: #3d3070;
}

.badge.unlocked {
  border-color: #c89820;
  color: #f0c040;
  background: rgba(240, 192, 64, 0.12);
}

.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1430;
  border: 1px solid #9060e0;
  color: #b090ff;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 0.85rem;
  z-index: 2000;
  pointer-events: none;
  animation: toast-in 0.3s ease;
  font-weight: 600;
}

@keyframes toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.popup-num {
  position: fixed;
  pointer-events: none;
  font-size: 1.3rem;
  font-weight: 800;
  color: #f0c040;
  animation: popup-float 0.8s ease-out forwards;
  z-index: 900;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
}

@keyframes popup-float {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-60px); }
}

.ad-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.95);
  z-index: 999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}

.ad-modal.show {
  display: flex;
}

.ad-card {
  background: linear-gradient(135deg, #111 0%, #1a0a2a 100%);
  border: 2px solid #9060e0;
  border-radius: 16px;
  padding: 40px 24px;
  text-align: center;
  width: min(380px, 90vw);
}

.ad-emoji {
  font-size: 3.5rem;
  margin-bottom: 10px;
}

.ad-label {
  color: #9060e0;
  font-size: 1.1rem;
  font-weight: 700;
  margin: 10px 0;
}

.ad-timer {
  font-size: 3.2rem;
  font-weight: 900;
  color: #f0c040;
  line-height: 1;
  margin: 15px 0;
}

.ad-hint {
  color: #605080;
  font-size: 0.8rem;
}

.ad-claim {
  display: none;
  background: linear-gradient(135deg, #30a050 0%, #40c060 100%);
  border: none;
  border-radius: 12px;
  color: #062010;
  font-size: 1rem;
  font-weight: 700;
  padding: 14px 32px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: transform 0.2s;
  margin-top: 15px;
}

.ad-claim:active {
  transform: scale(0.95);
}

.ad-claim.show {
  display: block;
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .gem-button { width: 140px; height: 140px; font-size: 4rem; }
  .stats { padding: 12px 16px; }
  .main-number { font-size: 1.8rem; }
}
</style>
</head>
<body>

<div id="game">
  <h1>💎 Galaxy Clicker</h1>
  <p class="subtitle">Кликай • Зарабатывай • Улучшай</p>

  <div class="stats">
    <div class="main-number" id="gems">0 💎</div>
    <div class="stat-row">
      <div class="stat-item">
        <span class="stat-label">За клик</span>
        <span class="stat-value" id="perClick">1</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">В сек</span>
        <span class="stat-value" id="perSec">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Всего</span>
        <span class="stat-value" id="total">0</span>
      </div>
    </div>
  </div>

  <button class="gem-button" id="gemBtn">💎</button>

  <button class="ad-btn" id="adBtn">📺 Реклама → +50 💎</button>

  <div class="shop">
    <div class="section-title">🛒 Магазин</div>
    <div id="shopList"></div>
  </div>

  <div class="achievements">
    <div class="section-title">🏆 Достижения</div>
    <div class="ach-grid" id="achiList"></div>
  </div>
</div>

<div class="ad-modal" id="adModal">
  <div class="ad-card">
    <div class="ad-emoji">📺</div>
    <div class="ad-label">РЕКЛАМА</div>
    <div class="ad-timer" id="adTimer">5</div>
    <div class="ad-hint">Досмотри до конца</div>
  </div>
  <button class="ad-claim" id="claimBtn" onclick="claimAd()">✅ Получить +50 💎</button>
</div>

<script>
const ITEMS = [
  { icon: "⛏️", name: "Кирка", desc: "+1 за клик", price: 700, cpc: 1, cps: 0, mult: 1.4 },
  { icon: "🔮", name: "Магический шар", desc: "+1 в сек", price: 4000, cpc: 0, cps: 0.2, mult: 1.5 },
  { icon: "🐉", name: "Дракон", desc: "+5 за клик", price: 6000, cpc: 5, cps: 0, mult: 1.6 },
  { icon: "🏰", name: "Замок", desc: "+5 в сек", price: 10500, cpc: 0, cps: 1, mult: 1.7 },
  { icon: "✨", name: "Волшебник", desc: "+20 за клик, +2/сек", price: 15000, cpc: 20, cps: 0.4, mult: 1.8 },
  { icon: "🌌", name: "Портал", desc: "+30 в сек", price: 35000, cpc: 0, cps: 6, mult: 2.0 }
];

const ACHIS = [
  { id: 'a1', name: 'Первый клик', check: g => g.total >= 1 },
  { id: 'a2', name: '100 кристаллов', check: g => g.total >= 100 },
  { id: 'a3', name: '1 000', check: g => g.total >= 1000 },
  { id: 'a4', name: '10 000', check: g => g.total >= 10000 },
  { id: 'a5', name: '100 000', check: g => g.total >= 100000 },
  { id: 'a6', name: '1-й апгрейд', check: g => g.upg.some(x => x > 0) },
  { id: 'a7', name: '10 апгрейдов', check: g => g.upg.reduce((a, b) => a + b) >= 10 },
  { id: 'a8', name: '10/сек', check: g => g.perSec >= 10 }
];

let state = {
  gems: parseInt(localStorage.getItem('gems') || '0'),
  total: parseInt(localStorage.getItem('total') || '0'),
  perClick: 1,
  perSec: 0,
  upg: JSON.parse(localStorage.getItem('upg') || '[0,0,0,0,0,0]'),
  achi: JSON.parse(localStorage.getItem('achi') || '{}')
};

let adBusy = false;

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toString();
}

function save() {
  localStorage.setItem('gems', Math.floor(state.gems));
  localStorage.setItem('total', Math.floor(state.total));
  localStorage.setItem('upg', JSON.stringify(state.upg));
  localStorage.setItem('achi', JSON.stringify(state.achi));
}

function recalc() {
  state.perClick = 1;
  state.perSec = 0;
  for (let i = 0; i < ITEMS.length; i++) {
    state.perClick += ITEMS[i].cpc * state.upg[i];
    state.perSec += ITEMS[i].cps * state.upg[i];
  }
}

function render() {
  document.getElementById('gems').textContent = fmt(state.gems) + ' 💎';
  document.getElementById('perClick').textContent = fmt(state.perClick);
  document.getElementById('perSec').textContent = fmt(state.perSec);
  document.getElementById('total').textContent = fmt(state.total);
  renderShop();
  renderAchi();
}

function renderShop() {
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  for (let i = 0; i < ITEMS.length; i++) {
    const it = ITEMS[i];
    const p = Math.floor(it.price * Math.pow(it.mult, state.upg[i]));
    const can = state.gems >= p;
    const card = document.createElement('button');
    card.className = 'item-card' + (can ? '' : ' locked');
    let eff = '';
    if (it.cpc) eff += '+' + it.cpc + '/клик ';
    if (it.cps) eff += '+' + it.cps + '/сек';
    card.innerHTML = `
      <div class="item-icon">${it.icon}</div>
      <div class="item-info">
        <div class="item-name">${it.name}</div>
        <div class="item-desc">${it.desc}</div>
      </div>
      <div class="item-right">
        <div class="item-price${can ? ' affordable' : ''}">💎 ${fmt(p)}</div>
        <div class="item-effect">${eff}</div>
        <div class="item-count">×${state.upg[i]}</div>
      </div>
    `;
    card.onclick = () => {
      if (state.gems < p) { toast('❌ Мало кристаллов!'); return; }
      state.gems -= p;
      state.upg[i]++;
      recalc();
      render();
      save();
      toast(it.icon + ' ' + it.name);
    };
    list.appendChild(card);
  }
}

function renderAchi() {
  const list = document.getElementById('achiList');
  list.innerHTML = '';
  for (const a of ACHIS) {
    const unlocked = state.achi[a.id];
    if (!unlocked && a.check(state)) {
      state.achi[a.id] = true;
      toast('🏆 ' + a.name);
    }
    const badge = document.createElement('div');
    badge.className = 'badge ' + (state.achi[a.id] ? 'unlocked' : 'locked');
    badge.textContent = (state.achi[a.id] ? '✓ ' : '🔒 ') + a.name;
    list.appendChild(badge);
  }
}

document.getElementById('gemBtn').onclick = e => {
  state.gems += state.perClick;
  state.total += state.perClick;
  render();
  
  const pop = document.createElement('div');
  pop.className = 'popup-num';
  pop.textContent = '+' + fmt(state.perClick);
  pop.style.left = e.clientX + 'px';
  pop.style.top = e.clientY + 'px';
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 900);
};

document.getElementById('adBtn').onclick = () => {
  if (adBusy) return;
  adBusy = true;
  document.getElementById('adModal').classList.add('show');
  document.getElementById('claimBtn').classList.remove('show');
  let sec = 5;
  document.getElementById('adTimer').textContent = sec;
  const timer = setInterval(() => {
    sec--;
    document.getElementById('adTimer').textContent = sec > 0 ? sec : '✓';
    if (sec <= 0) {
      clearInterval(timer);
      document.getElementById('claimBtn').classList.add('show');
    }
  }, 1000);
};

function claimAd() {
  document.getElementById('adModal').classList.remove('show');
  state.gems += 50;
  state.total += 50;
  render();
  save();
  toast('🎁 +50 💎');
  
  const btn = document.getElementById('adBtn');
  btn.disabled = true;
  let cd = 30;
  btn.textContent = '⏳ ' + cd + 'с';
  const timer = setInterval(() => {
    cd--;
    btn.textContent = '⏳ ' + cd + 'с';
    if (cd <= 0) {
      clearInterval(timer);
      adBusy = false;
      btn.disabled = false;
      btn.textContent = '📺 Реклама → +50 💎';
    }
  }, 1000);
}

function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

recalc();
render();

setInterval(() => {
  if (state.perSec > 0) {
    state.gems += state.perSec / 20;
    state.total += state.perSec / 20;
    document.getElementById('gems').textContent = fmt(state.gems) + ' 💎';
    document.getElementById('total').textContent = fmt(state.total);
  }
}, 50);

setInterval(save, 5000);
</script>
</body>
</html>
